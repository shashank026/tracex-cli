# Built and published by .github/workflows/release.yml when a v* tag is pushed.
version: 2
project_name: tracex
builds:
  - main: .
    binary: tracex
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}} -X main.commit={{.ShortCommit}}
archives:
  # No version in the name, so install.sh can use releases/latest/download/...
  - name_template: "tracex_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
